name: Build Actions SDK Plugin

on:
  push:
    branches: [main]
    # Pushing a tag like `plugin-v1.0.0` triggers the package job, which builds,
    # packs, verifies, and attaches the .lplug4 to the matching GitHub Release.
    tags: ['plugin-v*']
  pull_request:
    paths:
      - 'plugins/cursorpilot-actions-plugin/**'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

jobs:
  # Always-green check on a stock Windows runner. Validates the package layout the
  # Logitech Marketplace requires. Never needs the SDK, so it runs anywhere.
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/cursorpilot-actions-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package metadata
        shell: pwsh
        run: |
          $meta = "CursorPilotPlugin/package/metadata"
          $yaml = Join-Path $meta "LoupedeckPackage.yaml"
          if (-not (Test-Path $yaml)) { throw "Missing $yaml" }
          $icons = Get-ChildItem $meta -Filter *.png
          if ($icons.Count -lt 1) { throw "No plugin icon (*.png) found in $meta" }
          if (-not (Select-String -Path $yaml -Pattern '^type:\s*plugin4')) { throw "LoupedeckPackage.yaml must declare 'type: plugin4'" }
          Write-Host "Package metadata OK: $yaml + $($icons.Count) icon(s)"

  # Builds + packs the real .lplug4 and (on a plugin-v* tag) attaches it to the
  # GitHub Release. Runs only on tag pushes or manual dispatch.
  #
  # AUTOMATION TOGGLE: by default this runs on `windows-latest`, which has NO SDK,
  # so it validates + warns but produces no .lplug4. To make it actually build and
  # attach the binary, set a repo variable `PLUGIN_RUNNER` to your self-hosted
  # Windows runner's label (Settings → Secrets and variables → Actions → Variables).
  # Example value: logi-sdk  (register the runner with that label + Logi Options+).
  # No workflow edit needed — just set the variable once.
  package:
    if: startsWith(github.ref, 'refs/tags/plugin-v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.PLUGIN_RUNNER || 'windows-latest' }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: plugins/cursorpilot-actions-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Install Logi Options+ on the (hosted) runner via the documented silent
      # installer. It provides PluginApi.dll + logiplugintool, which is all the build
      # and pack need — no GUI or physical device required. Skipped automatically if
      # the SDK is already present (e.g. a self-hosted runner via PLUGIN_RUNNER), or
      # if the INSTALL_LOGI_SDK repo variable is set to 'false'.
      - name: Install Logi Actions SDK (Logi Options+)
        if: vars.INSTALL_LOGI_SDK != 'false'
        shell: pwsh
        run: |
          $apiDll = "C:\Program Files\Logi\LogiPluginService\PluginApi.dll"
          if (Test-Path $apiDll) { Write-Host "SDK already present; skipping install."; exit 0 }

          $url = "https://download01.logi.com/web/ftp/pub/techsupport/optionsplus/logioptionsplus_installer.exe"
          $exe = Join-Path $env:RUNNER_TEMP "logioptionsplus_installer.exe"
          Write-Host "Downloading Logi Options+ installer..."
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing

          Write-Host "Running silent install..."
          Start-Process -FilePath $exe -ArgumentList "/quiet","/update","no","/analytics","no","/sso","no" -Wait

          # The launcher may return before files are fully placed; wait for PluginApi.dll.
          $deadline = (Get-Date).AddMinutes(8)
          while (-not (Test-Path $apiDll) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 10 }
          Write-Host "PluginApi.dll present: $(Test-Path $apiDll)"

      # logiplugintool is Logitech's official .NET tool on NuGet (it packs/verifies
      # .lplug4). `dotnet tool update` installs it or upgrades if already present.
      - name: Install LogiPluginTool (.NET tool)
        shell: pwsh
        run: |
          dotnet tool update --global LogiPluginTool
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Detect Logi Actions SDK
        id: sdk
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $hasApi = Test-Path "C:\Program Files\Logi\LogiPluginService\PluginApi.dll"
          $hasTool = $null -ne (Get-Command logiplugintool -ErrorAction SilentlyContinue)
          "has_sdk=$([string]($hasApi -and $hasTool).ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "PluginApi.dll: $hasApi, logiplugintool: $hasTool"
          if (-not ($hasApi -and $hasTool)) {
            Write-Host "::warning::Logi Actions SDK not fully available (PluginApi.dll: $hasApi, logiplugintool: $hasTool). See BUILDING.md."
          }

      # A release tag must produce a binary. If the SDK is missing on a tag build,
      # fail loudly instead of publishing a release with no .lplug4 attached.
      - name: Require SDK for release tags
        if: startsWith(github.ref, 'refs/tags/plugin-v') && steps.sdk.outputs.has_sdk != 'true'
        shell: pwsh
        run: |
          Write-Host "::error::Release tag $env:GITHUB_REF_NAME was pushed, but no Logi Actions SDK is available on this runner, so no .lplug4 can be built. Set the PLUGIN_RUNNER repo variable to a self-hosted Windows runner with Logi Options+ installed, then re-push the tag. See plugins/cursorpilot-actions-plugin/BUILDING.md."
          exit 1

      - name: Build (Release)
        if: steps.sdk.outputs.has_sdk == 'true'
        run: dotnet build CursorPilotPlugin.sln -c Release

      - name: Pack + verify .lplug4
        if: steps.sdk.outputs.has_sdk == 'true'
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $version = (Select-String -Path "CursorPilotPlugin/package/metadata/LoupedeckPackage.yaml" -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          $out = "CursorPilot_$($version -replace '\.','_').lplug4"
          logiplugintool pack ./bin/Release/ ./$out
          if ($LASTEXITCODE -ne 0) { throw "pack failed ($LASTEXITCODE)" }
          logiplugintool verify ./$out
          if ($LASTEXITCODE -ne 0) { throw "verify failed ($LASTEXITCODE)" }
          if (-not (Test-Path "./$out")) { throw "Expected $out was not produced" }
          Write-Host "Built $out"

      - name: Upload .lplug4 artifact
        if: steps.sdk.outputs.has_sdk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cursorpilot-actions-plugin
          path: plugins/cursorpilot-actions-plugin/*.lplug4
          retention-days: 30

      # On a plugin-v* tag, attach the binary to that release (creates it if absent).
      - name: Attach .lplug4 to release
        if: steps.sdk.outputs.has_sdk == 'true' && startsWith(github.ref, 'refs/tags/plugin-v')
        uses: softprops/action-gh-release@v2
        with:
          files: plugins/cursorpilot-actions-plugin/*.lplug4
          fail_on_unmatched_files: true
          # If the tag has no release yet, create one with auto-generated notes.
          # Existing releases (e.g. plugin-v1.0.0) keep their notes; only the file is added.
          generate_release_notes: true
